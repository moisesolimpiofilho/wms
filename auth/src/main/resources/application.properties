# Configuração da porta da aplicação
server.port=8082

# Configuração do PostgreSQL (permite rodar localmente no localhost ou no container docker postgres)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meudb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:senha1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Configuração do Redis (caso venha a ser utilizado com a dependência spring-boot-starter-data-redis)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:senha1234}

# Configuração do token JWT, expira em 1 hora
jwt.secret=${JWT_SECRET:minha_chave_padrao_para_dev_local_123456}
jwt.expiration=3600000

# ===================================================================
# SWAGGER / OPENAPI - AGRUPAMENTO DE APIS NO GATEWAY
# ===================================================================
# Habilita o menu dropdown "Select a spec" no topo do Swagger UI
springdoc.swagger-ui.urls[0].name=1. Auth Service (Autenticação)
springdoc.swagger-ui.urls[0].url=/v3/api-docs

springdoc.swagger-ui.urls[1].name=2. Warehouse Service (Estoque)
springdoc.swagger-ui.urls[1].url=/warehouse-docs/v3/api-docs

# ===================================================================
# ROTAS DO SPRING CLOUD GATEWAY MVC
# ===================================================================

# Rota 1: Redireciona TODAS as requisições de negócio (/api/estoques, /api/categorias, /api/lotes, etc.)
spring.cloud.gateway.mvc.routes[0].id=warehouse_api_route
spring.cloud.gateway.mvc.routes[0].uri=http://warehouse:8080
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/**

# Rota 2: Redireciona a documentação OpenAPI do Warehouse com remoção do prefixo "/warehouse-docs"
spring.cloud.gateway.mvc.routes[1].id=warehouse_swagger_docs
spring.cloud.gateway.mvc.routes[1].uri=http://warehouse:8080
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/warehouse-docs/v3/api-docs/**
spring.cloud.gateway.mvc.routes[1].filters[0]=StripPrefix=1