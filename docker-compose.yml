version: '3.8'

services:
  # Servicio de Autenticação
  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: auth_api
    ports:
      - "8082:8082"
    environment:
      # Aponta para o container exclusivo auth_postgres na porta interna 5432
      - SPRING_DATASOURCE_URL=jdbc:postgresql://auth_postgres:5432/auth_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=senha_auth_123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=senha1234
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      auth_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  warehouse:
    build:
      context: ./warehouse_module
      dockerfile: Dockerfile
    container_name: warehouse_api
    # Comentado pois vai usar o Gateway na porta do auth como entrada
    # ports:
    #  - "8083:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/meudb
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=senha1234
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_DATA_REDIS_PASSWORD=senha1234
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth:8082
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  # Banco de Dados Exclusivo do Auth
  auth_postgres:
    image: postgres:16-alpine
    container_name: auth_postgres_db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_auth_123
    ports:
      - "5434:5432" # Porta externa 5433 para não conflitar com a 5432
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    container_name: postgres_db
    environment:
      POSTGRES_DB: meudb
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha1234
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d meudb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:alpine
    container_name: redis_cache
    command: redis-server --requirepass senha1234
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "senha1234", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  auth_postgres_data:
  postgres_data:
  redis_data: